<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini E-Commerce Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #222;
      color: white;
      padding: 20px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    .cart-btn {
      background: white;
      color: #222;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h2 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #666;
    }

    /* Products */

    .products {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .product-card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    .product-image {
      height: 200px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-info p {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .add-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .add-btn:hover {
      background: #444;
    }

    /* Modal */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
      padding: 25px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .close {
      font-size: 25px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
      gap: 10px;
    }

    .cart-item h4 {
      margin-bottom: 5px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      border: none;
      background: #222;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove-btn {
      border: none;
      background: #e74c3c;
      color: white;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .cart-total {
      font-size: 22px;
      font-weight: bold;
      text-align: right;
      margin: 20px 0;
    }

    .checkout-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #27ae60;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: #219150;
    }

    .empty-cart {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    @media (max-width: 900px) {
      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      header {
        padding: 15px 5%;
      }

      .products {
        grid-template-columns: 1fr;
      }

      .intro h2 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>ShopEasy</h1>

    <button class="cart-btn" id="cartButton">
      Cart (<span id="cartCount">0</span>)
    </button>
  </header>

  <main class="container">

    <section class="intro">
      <h2>Featured Products</h2>
      <p>Choose your favorite products and add them to your cart.</p>
    </section>

    <section class="products" id="productContainer">
      <!-- Products generated using JavaScript -->
    </section>

  </main>

  <!-- Cart Modal -->

  <div class="modal" id="cartModal">

    <div class="modal-content">

      <div class="modal-header">
        <h2>Your Shopping Cart</h2>
        <span class="close" id="closeModal">&times;</span>
      </div>

      <div id="cartItems"></div>

      <div class="cart-total">
        Total: ₹<span id="cartTotal">0</span>
      </div>

      <button class="checkout-btn" id="checkoutButton">
        Checkout
      </button>

    </div>

  </div>

  <script>

    // Product data

    const products = [
      {
        id: 1,
        name: "Wireless Headphones",
        price: 1999,
        icon: "🎧",
        description: "High-quality wireless headphones."
      },
      {
        id: 2,
        name: "Smart Watch",
        price: 2999,
        icon: "⌚",
        description: "Smart watch with fitness tracking."
      },
      {
        id: 3,
        name: "Running Shoes",
        price: 2499,
        icon: "👟",
        description: "Comfortable shoes for daily running."
      },
      {
        id: 4,
        name: "Backpack",
        price: 1499,
        icon: "🎒",
        description: "Stylish and durable everyday backpack."
      },
      {
        id: 5,
        name: "Sunglasses",
        price: 999,
        icon: "🕶️",
        description: "Modern sunglasses with UV protection."
      },
      {
        id: 6,
        name: "Smartphone",
        price: 15999,
        icon: "📱",
        description: "Powerful smartphone for everyday use."
      },
      {
        id: 7,
        name: "Gaming Mouse",
        price: 1299,
        icon: "🖱️",
        description: "Fast and accurate gaming mouse."
      },
      {
        id: 8,
        name: "Keyboard",
        price: 1799,
        icon: "⌨️",
        description: "Mechanical keyboard for gaming and work."
      }
    ];

    let cart = [];

    const productContainer =
      document.getElementById("productContainer");

    const cartCount =
      document.getElementById("cartCount");

    const cartModal =
      document.getElementById("cartModal");

    const cartItems =
      document.getElementById("cartItems");

    const cartTotal =
      document.getElementById("cartTotal");


    // Render products

    function renderProducts() {

      productContainer.innerHTML = "";

      products.forEach(product => {

        const card = document.createElement("div");

        card.classList.add("product-card");

        card.innerHTML = `
          <div class="product-image">
            ${product.icon}
          </div>

          <div class="product-info">

            <h3>${product.name}</h3>

            <p>${product.description}</p>

            <div class="price">
              ₹${product.price.toLocaleString("en-IN")}
            </div>

            <button
              class="add-btn"
              onclick="addToCart(${product.id})">
              Add to Cart
            </button>

          </div>
        `;

        productContainer.appendChild(card);
      });
    }


    // Add product

    function addToCart(productId) {

      const product = products.find(
        item => item.id === productId
      );

      const existingItem = cart.find(
        item => item.id === productId
      );

      if (existingItem) {
        existingItem.quantity++;
      } else {

        cart.push({
          ...product,
          quantity: 1
        });

      }

      updateCart();
    }


    // Update cart

    function updateCart() {

      cartItems.innerHTML = "";

      if (cart.length === 0) {

        cartItems.innerHTML =
          `<div class="empty-cart">
            Your cart is empty.
          </div>`;

        cartTotal.textContent = "0";
        cartCount.textContent = "0";

        return;
      }

      let total = 0;
      let count = 0;

      cart.forEach(item => {

        total += item.price * item.quantity;
        count += item.quantity;

        const cartItem =
          document.createElement("div");

        cartItem.classList.add("cart-item");

        cartItem.innerHTML = `

          <div>
            <h4>${item.name}</h4>
            <p>
              ₹${item.price.toLocaleString("en-IN")}
            </p>
          </div>

          <div class="quantity-controls">

            <button
              onclick="changeQuantity(${item.id}, -1)">
              -
            </button>

            <span>${item.quantity}</span>

            <button
              onclick="changeQuantity(${item.id}, 1)">
              +
            </button>

          </div>

          <button
            class="remove-btn"
            onclick="removeFromCart(${item.id})">
            Remove
          </button>

        `;

        cartItems.appendChild(cartItem);

      });

      cartCount.textContent = count;

      cartTotal.textContent =
        total.toLocaleString("en-IN");
    }


    // Change quantity

    function changeQuantity(productId, amount) {

      const item = cart.find(
        item => item.id === productId
      );

      if (!item) return;

      item.quantity += amount;

      if (item.quantity <= 0) {
        removeFromCart(productId);
        return;
      }

      updateCart();
    }


    // Remove product

    function removeFromCart(productId) {

      cart = cart.filter(
        item => item.id !== productId
      );

      updateCart();
    }


    // Open cart

    document
      .getElementById("cartButton")
      .addEventListener("click", () => {

        updateCart();

        cartModal.style.display = "flex";
      });


    // Close cart

    document
      .getElementById("closeModal")
      .addEventListener("click", () => {

        cartModal.style.display = "none";
      });


    // Close modal when clicking outside

    window.addEventListener("click", event => {

      if (event.target === cartModal) {
        cartModal.style.display = "none";
      }

    });


    // Checkout

    document
      .getElementById("checkoutButton")
      .addEventListener("click", () => {

        if (cart.length === 0) {
          alert("Your cart is empty!");
          return;
        }

        const total = cart.reduce(
          (sum, item) =>
            sum + item.price * item.quantity,
          0
        );

        alert(
          `Checkout Preview\n\n` +
          `Items: ${cart.length}\n` +
          `Total: ₹${total.toLocaleString("en-IN")}\n\n` +
          `Thank you for shopping!`
        );

      });


    // Initial rendering

    renderProducts();
    updateCart();

  </script>

</body>
</html>
